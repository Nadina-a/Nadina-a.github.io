<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>☕ Кофемашина - Анимация</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #333;
    }
    
    .coffee-machine {
      position: relative;
      width: 400px;
      height: 500px;
      background-color: #303030;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
      padding: 20px;
    }
    
    .machine-top {
      position: relative;
      width: 100%;
      height: 100px;
      background-color: #252525;
      border-radius: 10px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .water-tank {
      position: absolute;
      top: 10px;
      right: 20px;
      width: 80px;
      height: 80px;
      background-color: rgba(120, 180, 255, 0.3);
      border: 2px solid #444;
      border-radius: 5px;
      overflow: hidden;
    }
    
    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70%;
      background-color: rgba(120, 180, 255, 0.6);
      transition: height 1s;
    }
    
    .water.empty {
      height: 0%;
    }
    
    .control-panel {
      width: 100%;
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
    }
    
    .button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #333, #222);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: all 0.3s;
      color: white;
      font-weight: bold;
      -webkit-user-select: none;
      user-select: none;
    }
    
    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    }
    
    .button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .button.espresso {
      background: linear-gradient(145deg, #5a3a28, #3a2a18);
    }
    
    .button.latte {
      background: linear-gradient(145deg, #9c7a58, #7c5a38);
    }
    
    .button.cappuccino {
      background: linear-gradient(145deg, #d4c4b4, #b4a494);
    }
    
    .coffee-outlet {
      position: relative;
      width: 100%;
      height: 200px;
      display: flex;
      justify-content: center;
    }
    
    .nozzle {
      position: absolute;
      top: 0;
      width: 40px;
      height: 60px;
      background-color: #222;
      border-radius: 0 0 20px 20px;
      z-index: 2;
    }
    
    .coffee-stream {
      position: absolute;
      top: 60px;
      width: 10px;
      height: 0;
      background: linear-gradient(to bottom, #5a3a28, #3a2a18);
      border-radius: 5px;
      opacity: 0;
      transition: height 0.5s, opacity 0.5s;
      z-index: 1;
    }
    
    .coffee-stream.pouring {
      height: 80px;
      opacity: 1;
    }
    
    .cup-platform {
      position: absolute;
      bottom: 0;
      width: 150px;
      height: 10px;
      background-color: #444;
      border-radius: 5px;
    }
    
    .cup {
      position: absolute;
      bottom: 10px;
      width: 100px;
      height: 80px;
      background: linear-gradient(to right, #fff, #e0e0e0);
      border-radius: 5px 5px 50px 50px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(100px);
      transition: opacity 0.5s, transform 0.5s;
    }
    
    .cup.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .coffee-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0;
      background-color: #5a3a28;
      transition: height 3s;
    }
    
    .coffee-fill.filled {
      height: 60px;
    }
    
    .steam {
      position: absolute;
      width: 8px;
      height: 30px;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.5s;
    }
    
    .steam.visible {
      opacity: 1;
      animation: steam 3s infinite;
    }
    
    .steam1 {
      left: 30px;
      top: -30px;
    }
    
    .steam2 {
      left: 50px;
      top: -30px;
      animation-delay: 0.5s;
    }
    
    .steam3 {
      left: 70px;
      top: -30px;
      animation-delay: 1s;
    }
    
    .status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }
    
    .refill-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    .refill-button:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }
    
    .refill-button:active {
      transform: translateY(1px);
    }
    
    .refill-button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    
    @keyframes steam {
      0% {
        transform: translateY(0) scaleX(1);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      50% {
        transform: translateY(-20px) scaleX(3);
        opacity: 0.5;
      }
      100% {
        transform: translateY(-40px) scaleX(1);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="coffee-machine">
    <div class="machine-top">
      <div class="water-tank">
        <div class="water" id="water"></div>
      </div>
    </div>
    
    <div class="control-panel">
      <div class="button espresso" id="espresso-btn">
        Эспрессо
      </div>
      <div class="button latte" id="latte-btn">
        Латте
      </div>
      <div class="button cappuccino" id="cappuccino-btn">
        Капучино
      </div>
    </div>
    
    <div class="coffee-outlet">
      <div class="nozzle"></div>
      <div class="coffee-stream" id="coffee-stream"></div>
      <div class="cup-platform"></div>
      <div class="cup" id="cup">
        <div class="coffee-fill" id="coffee-fill"></div>
        <div class="steam steam1" id="steam1"></div>
        <div class="steam steam2" id="steam2"></div>
        <div class="steam steam3" id="steam3"></div>
      </div>
    </div>
  </div>
  
  <div class="status" id="status">Выберите напиток</div>
  <button class="refill-button" id="refill-btn">Долить воду</button>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Элементы DOM
      const waterEl = document.getElementById('water');
      const coffeeStreamEl = document.getElementById('coffee-stream');
      const cupEl = document.getElementById('cup');
      const coffeeFillEl = document.getElementById('coffee-fill');
      const steam1El = document.getElementById('steam1');
      const steam2El = document.getElementById('steam2');
      const steam3El = document.getElementById('steam3');
      const statusEl = document.getElementById('status');
      const refillBtn = document.getElementById('refill-btn');
      
      // Кнопки кофе
      const espressoBtn = document.getElementById('espresso-btn');
      const latteBtn = document.getElementById('latte-btn');
      const cappuccinoBtn = document.getElementById('cappuccino-btn');
      
      // Состояние
      let waterLevel = 70;
      let isMakingCoffee = false;
      
      // Обновление воды
      function updateWaterLevel() {
        waterEl.style.height = waterLevel + '%';
        if (waterLevel <= 0) {
          waterEl.classList.add('empty');
          disableButtons(true);
          statusEl.textContent = 'Нет воды! Долейте воду.';
          refillBtn.disabled = false;
        } else {
          waterEl.classList.remove('empty');
          disableButtons(false);
          statusEl.textContent = 'Выберите напиток';
          refillBtn.disabled = waterLevel >= 70;
        }
      }
      
      // Включение/выключение кнопок
      function disableButtons(disabled) {
        espressoBtn.style.opacity = disabled ? '0.5' : '1';
        latteBtn.style.opacity = disabled ? '0.5' : '1';
        cappuccinoBtn.style.opacity = disabled ? '0.5' : '1';
        
        espressoBtn.style.pointerEvents = disabled ? 'none' : 'auto';
        latteBtn.style.pointerEvents = disabled ? 'none' : 'auto';
        cappuccinoBtn.style.pointerEvents = disabled ? 'none' : 'auto';
      }
      
      // Приготовление кофе
      function makeCoffee(type, waterUsage, fillHeight) {
        if (isMakingCoffee || waterLevel <= 0) return;
        
        isMakingCoffee = true;
        disableButtons(true);
        refillBtn.disabled = true;
        
        // Показываем чашку
        cupEl.classList.add('visible');
        
        // Обновляем статус
        statusEl.textContent = `Готовим ${type}...`;
        
        // Начинаем наливать через 1 секунду
        setTimeout(() => {
          // Запускаем поток кофе
          coffeeStreamEl.classList.add('pouring');
          
          // Уменьшаем уровень воды
          waterLevel -= waterUsage;
          updateWaterLevel();
          
          // Наполняем чашку
          setTimeout(() => {
            coffeeFillEl.classList.add('filled');
            coffeeFillEl.style.height = fillHeight + 'px';
            
            // Останавливаем поток
            setTimeout(() => {
              coffeeStreamEl.classList.remove('pouring');
              
              // Показываем пар
              setTimeout(() => {
                steam1El.classList.add('visible');
                steam2El.classList.add('visible');
                steam3El.classList.add('visible');
                
                statusEl.textContent = `Ваш ${type} готов!`;
                
                // Сбрасываем через 5 секунд
                setTimeout(resetCoffeeMachine, 5000);
              }, 500);
            }, 3000);
          }, 500);
        }, 1000);
      }
      
      // Сброс кофемашины
      function resetCoffeeMachine() {
        // Скрываем пар
        steam1El.classList.remove('visible');
        steam2El.classList.remove('visible');
        steam3El.classList.remove('visible');
        
        // Скрываем чашку
        setTimeout(() => {
          cupEl.classList.remove('visible');
          
          // Сбрасываем наполнение
          setTimeout(() => {
            coffeeFillEl.classList.remove('filled');
            coffeeFillEl.style.height = '0';
            
            // Обновляем статус
            isMakingCoffee = false;
            if (waterLevel > 0) {
              disableButtons(false);
              statusEl.textContent = 'Выберите напиток';
            }
            
            refillBtn.disabled = waterLevel >= 70;
          }, 500);
        }, 1000);
      }
      
      // Обработчики событий
      espressoBtn.addEventListener('click', () => {
        makeCoffee('эспрессо', 20, 30);
      });
      
      latteBtn.addEventListener('click', () => {
        makeCoffee('латте', 30, 50);
      });
      
      cappuccinoBtn.addEventListener('click', () => {
        makeCoffee('капучино', 25, 40);
      });
      
      refillBtn.addEventListener('click', () => {
        waterLevel = 70;
        updateWaterLevel();
        statusEl.textContent = 'Вода долита! Выберите напиток';
      });
      
      // Инициализация
      updateWaterLevel();
    });
  </script>
</body>
</html>
