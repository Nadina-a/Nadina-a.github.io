<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>☕ Coffee animation</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    
    .coffee-container {
      position: relative;
      width: 200px;
      height: 250px;
    }
    
    .cup {
      position: absolute;
      width: 150px;
      height: 180px;
      background-color: #fff;
      border-radius: 0 0 70px 70px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 1;
      left: 25px;
    }
    
    .handle {
      position: absolute;
      width: 40px;
      height: 80px;
      border: 10px solid #fff;
      border-radius: 20px;
      left: 160px;
      top: 50px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    
    .coffee {
      position: absolute;
      width: 130px;
      height: 130px;
      background-color: #6F4E37;
      border-radius: 0 0 65px 65px;
      top: 20px;
      left: 35px;
      z-index: 2;
      overflow: hidden;
    }
    
    .steam {
      position: absolute;
      width: 8px;
      height: 50px;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      z-index: 3;
    }
    
    .steam1 {
      left: 50px;
      top: -30px;
      animation: steam 3s infinite;
    }
    
    .steam2 {
      left: 90px;
      top: -30px;
      animation: steam 3s infinite 0.5s;
    }
    
    .steam3 {
      left: 70px;
      top: -30px;
      animation: steam 3s infinite 1s;
    }
    
    @keyframes steam {
      0% {
        transform: translateY(0) scaleX(1);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      50% {
        transform: translateY(-50px) scaleX(3);
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100px) scaleX(1);
        opacity: 0;
      }
    }
    
    .ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      z-index: 2;
      animation: ripple 4s infinite;
    }
    
    .ripple1 {
      left: 50px;
      top: 80px;
      animation-delay: 0s;
    }
    
    .ripple2 {
      left: 90px;
      top: 60px;
      animation-delay: 1s;
    }
    
    @keyframes ripple {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      100% {
        transform: scale(3);
        opacity: 0;
      }
    }
    
    h1 {
      margin-top: 30px;
      color: #6F4E37;
    }
  </style>
</head>
<body>
  <div class="coffee-container">
    <div class="cup"></div>
    <div class="handle"></div>
    <div class="coffee">
      <div class="ripple ripple1"></div>
      <div class="ripple ripple2"></div>
    </div>
    <div class="steam steam1"></div>
    <div class="steam steam2"></div>
    <div class="steam steam3"></div>
  </div>
  <h1>Кофейная анимация</h1>
</body>
</html>
